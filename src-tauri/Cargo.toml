[package]
name = "layerdeck"
version = "0.4.0"
description = "透過PNG リアルタイム重ね合わせプレビュー"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "layerdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebView2 の設定を直接変えるため（既定の右クリックメニューとブラウザのショートカットを止める）。
# wry が使っているのと同じ版にそろえる必要がある。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
